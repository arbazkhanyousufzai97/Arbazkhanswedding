*{margin:0;padding:0;box-sizing:border-box}
body{background:#fdf6ec;font-family:'Poppins',sans-serif;color:#4a3a22;overflow-x:hidden}

/* ===== ENTRY SCREEN - A♥A ===== */
#entryScreen{
position:fixed;top:0;left:0;width:100%;height:100vh;
background: radial-gradient(circle at center, #8e6b3d, #3e2f1a);
display:flex;flex-direction:column;justify-content:center;align-items:center;
z-index:9999;transition:0.8s all ease;
text-align:center;color:white;
}
#entryScreen.hide{transform:translateY(-100%);opacity:0;pointer-events:none}
.logo-circle{
width:140px;height:140px;border:3px solid #d4af37;border-radius:50%;
display:flex;justify-content:center;align-items:center;
font-family:'Great Vibes',cursive;font-size:54px;
background:rgba(255,255,255,0.08);backdrop-filter:blur(5px);
box-shadow:0 0 40px rgba(212,175,55,0.5);
animation:pulse 2s infinite;
}
@keyframes pulse{0%{box-shadow:0 0 20px rgba(212,175,55,0.5)}50%{box-shadow:0 0 40px rgba(212,175,55,0.9)}100%{box-shadow:0 0 20px rgba(212,175,55,0.5)}}
.entry-btn{
margin-top:35px;background:linear-gradient(135deg,#d4af37,#8e6b3d);
color:white;border:none;padding:14px 36px;border-radius:50px;
font-size:16px;font-weight:600;letter-spacing:1px;cursor:pointer;
box-shadow:0 8px 20px rgba(0,0,0,0.3);transition:0.3s
}
.entry-btn:hover{transform:scale(1.08)}
