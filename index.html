<style>
body{margin:0;background:#fdf6ec;font-family:Arial;text-align:center}
#entry{position:fixed;top:0;left:0;width:100%;height:100vh;background:#3e2f1a;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;color:white;transition:0.7s}

.card img{width:100%;border-radius:10px}
.loc{padding:15px}
.loc a{display:inline-block;background:#8e6b3d;color:white;padding:10px 20px;border-radius:20px;text-decoration:none;margin-top:10px}
