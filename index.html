<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arbaz Khan Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fdf6ec;font-family:'Poppins',sans-serif;overflow-x:hidden;color:#3a2a12}

/* ===== ENTRY GATE A♥A ===== */
#entry{
position:fixed;top:0;left:0;width:100%;height:100vh;
background: radial-gradient(circle at center, #d4af37 0%, #8e6b3d 40%, #2e2210 100%);
display:flex;flex-direction:column;justify-content:center;align-items:center;
z-index:9999;transition:0.9s all ease;text-align:center;color:white;
}
#entry.hide{transform:translateY(-100%);opacity:0}
.circle{
width:145px;height:145px;border:3px solid #ffeaa0;border-radius:50%;
display:flex;justify-content:center;align-items:center;
font-family:'Great Vibes',cursive;font-size:52px;
background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);
box-shadow:0 0 50px rgba(255,215,0,0.6);
animation:glow 2s infinite;
}
@keyframes glow{0%{box-shadow:0 0 20px gold}50%{box-shadow:0 0 50px gold}100%{box-shadow:0 0 20px gold}}
.btn-entry{
margin-top:32px;background:linear-gradient(135deg,#fff,#f3e5ab);
color:#6b4f2a;border:none;padding:15px 38px;border-radius:50px;
font-weight:700;font-size:15px;letter-spacing:1px;cursor:pointer;
box-shadow:0 10px 25px rgba(0,0,0,0.3);transition:0.3s
}
.btn-entry:hover{transform:scale(1.08)}

/* ===== HERO ===== */
.hero{background:radial-gradient(circle at top, #d4af37, #8e6b3d);padding:70px 20px 90px;text-align:center;color:white}
.hero h1{font-family:'Great Vibes',cursive;font-size:52px;margin-top:10px}
.container{max-width:800px;margin:-60px auto 0;padding:20px;position:relative;z-index:2}
.card-box{background:white;border-radius:24px;padding:14px;box-shadow:0 20px 60px rgba(100,70,20,0.25);margin-bottom:45px;border:3px solid #f9e8a8;overflow:hidden}
.card-box img{width:100%;border-radius:18px;display:block}
.venue{background:linear-gradient(180deg,#fff,#fff8e0);margin:-28px 15px 0;padding:26px;border-radius:18px;box-shadow:0 10px 25px rgba(0,0,0,0.08);border:1px solid #f9e8a8;text-align:center;position:relative}
.venue h3{color:#8e6b3d;font-size:22px}
.map{border-radius:12px;overflow:hidden;margin-top:14px;border:2px solid #f9e8a8}
.btn-gold{display:inline-block;margin-top:16px;background:linear-gradient(135deg,#8e6b3d,#d4af37);color:white;padding:12px 30px;border-radius:50px;text-decoration:none;font-weight:600;box-shadow:0 8px 20px rgba(212,175,55,0.4)}
.divider{text-align:center;color:#d4af37;font-size:22px;letter-spacing:12px;margin:10px 0 35px}
.footer{background:#fff6d6;border-top:3px solid #f9e8a8;padding:45px 20px;text-align:center;margin-top:30px}
.footer h2{font-family:'Great Vibes',cursive;font-size:46px;color:#8e6b3d}
.footer p{color:#a88a5a;font-size:12px;letter-spacing:2px;margin-top:8px;text-transform:uppercase}
</style>
</head>
<body>

<!-- ENTRY SCREEN -->
<div id="entry">
<div class="circle">A ♥ A</div>
<h2 style="font-family:'Great Vibes',cursive;font-size:42px;margin-top:22px">Arbaz Khan</h2>
<p style="letter-spacing:3px;font-size:12px;margin-top:6px;opacity:0.9">WEDDING INVITATION</p>
<p style="margin-top:8px;font-size:13px">Thursday 26th Nov 2026</
